name: Daily free clipping
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-clipping
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source
        run: |
          mkdir -p app-source
          tar -xzf source.tar.gz -C app-source
          mkdir -p app-source/public/data
          if [ -d data ]; then cp -r data/. app-source/public/data/; fi
      - name: Collect and publish news files
        run: |
          python app-source/scripts/collect.py
          python app-source/scripts/export-static.py
          mkdir -p data
          cp -r app-source/public/data/. data/
      - name: Save daily archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m 'Update daily financial news'
          git push
